<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Corner radii</span>
    <div class="row" style="gap:18px;align-items:flex-end;">
      <div class="col" style="align-items:center;gap:6px;"><div style="width:72px;height:72px;background:var(--cream-200);border:1px solid var(--hairline);border-radius:0;"></div><span class="mono">0</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:72px;height:72px;background:var(--cream-200);border:1px solid var(--hairline);border-radius:4px;"></div><span class="mono">4 · sm</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:72px;height:72px;background:var(--cream-200);border:1px solid var(--hairline);border-radius:8px;"></div><span class="mono">8 · md</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:72px;height:72px;background:var(--cream-200);border:1px solid var(--hairline);border-radius:14px;"></div><span class="mono">14 · lg</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:72px;height:72px;background:var(--cream-200);border:1px solid var(--hairline);border-radius:24px;"></div><span class="mono">24 · xl</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:140px;height:44px;background:var(--charcoal);color:var(--cream);font-family:var(--font-sans);font-size:13px;font-weight:500;letter-spacing:0.02em;display:flex;align-items:center;justify-content:center;border-radius:999px;">Notify me</div><span class="mono">999 · pill (default)</span></div>
    </div>
  </div>
</body></html>
