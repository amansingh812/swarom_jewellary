<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Texture — grain overlay & ambient orbs</span>
    <div class="row" style="gap:14px;">
      <div style="flex:1;position:relative;height:160px;background:var(--cream);border-radius:12px;overflow:hidden;border:1px solid var(--hairline);">
        <div class="swr-grain" style="position:absolute;inset:0;"></div>
        <span style="position:absolute;bottom:10px;left:12px;font-family:var(--font-sans);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg4);font-weight:500;">Cream + Grain</span>
      </div>
      <div style="flex:1;position:relative;height:160px;background:var(--cream);border-radius:12px;overflow:hidden;border:1px solid var(--hairline);">
        <div style="position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, #E6E4DF 0%, transparent 60%);opacity:0.7;filter:blur(20px);"></div>
        <div style="position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(184,149,106,0.3) 0%, transparent 60%);opacity:0.8;filter:blur(20px);"></div>
        <div class="swr-grain" style="position:absolute;inset:0;"></div>
        <span style="position:absolute;bottom:10px;left:12px;font-family:var(--font-sans);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg4);font-weight:500;">Ambient orbs</span>
      </div>
    </div>
    <div class="mono">Grain ≈ 4% opacity SVG fractalNoise · orbs blur-3xl, ~60% opacity, 6s ease-in-out float</div>
  </div>
</body></html>
