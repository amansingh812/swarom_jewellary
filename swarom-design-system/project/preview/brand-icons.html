<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>

  .ic span { font-family: var(--font-sans); font-size: 9px; color: var(--fg4); letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>

  <object data="../assets/icons.svg" type="image/svg+xml" style="display:none;width:0;height:0;"></object>

      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-sparkle"/></svg><span>sparkle</span></div>
      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-heart"/></svg><span>heart</span></div>

      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-user"/></svg><span>user</span></div>
      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-mail"/></svg><span>mail</span></div>
      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-shield"/></svg><span>shield</span></div>
      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-ring"/></svg><span>ring</span></div>

      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-truck"/></svg><span>truck</span></div>
      <div class="ic"><svg class="icon"><use href="../assets/icons.svg#swr-instagram"/></svg><span>instagram</span></div>
