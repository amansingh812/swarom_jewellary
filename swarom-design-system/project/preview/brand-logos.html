<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:36px 32px;">
  <div class="stack-16">
    <div class="row" style="gap:36px;align-items:center;">
      <div class="col" style="gap:12px;align-items:center;">
        <img src="../assets/swarom-monogram.svg" style="width:88px;height:88px;display:block;border-radius:14px;">
        <span class="mono">Monogram · dark</span>
      </div>
      <div class="col" style="gap:12px;align-items:center;">
        <img src="../assets/swarom-monogram-cream.svg" style="width:88px;height:88px;display:block;border-radius:14px;border:1px solid var(--hairline);">
        <span class="mono">Monogram · cream</span>
      </div>
      <div class="col" style="flex:1;align-items:center;gap:8px;">
        <div style="font-family:var(--font-serif);font-weight:400;font-size:64px;line-height:1;letter-spacing:-0.01em;color:var(--charcoal);">Swarom</div>
        <div style="height:1px;width:80px;background:linear-gradient(90deg,transparent,#B8956A,transparent);"></div>
        <span class="mono">Wordmark — Playfair Display 400</span>
      </div>
    </div>
    <div style="height:1px;background:var(--hairline);"></div>
    <div class="col" style="gap:8px;align-items:center;">
      <div style="font-family:var(--font-script);font-weight:400;font-size:96px;line-height:1;color:#B8956A;transform:rotate(-2deg);">Swarom</div>
      <span class="mono">Signature wordmark — Great Vibes · gold · used as tagline mark only</span>
    </div>
  </div>
</body></html>
