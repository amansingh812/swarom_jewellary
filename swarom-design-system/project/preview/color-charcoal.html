<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Charcoal — ink, buttons, wordmark</span>
    <div class="row" style="gap:12px;">
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#1F1B16;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Charcoal <span class="mono">· default</span></span>
          <span class="mono">#1F1B16 · --charcoal</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#2A241D;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Charcoal 800</span>
          <span class="mono">#2A241D · hover state</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#3A332A;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Charcoal 700</span>
          <span class="mono">#3A332A</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
