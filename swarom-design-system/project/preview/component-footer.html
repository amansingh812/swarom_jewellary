<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;">
  <div style="padding:32px 28px 24px;border-top:1px solid var(--hairline);background:var(--cream);">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div class="stack-8">
        <div style="font-family:var(--font-serif);font-weight:500;font-size:22px;color:var(--charcoal);">Swarom</div>
        <div style="font-family:var(--font-serif);font-style:italic;font-size:14px;color:var(--fg3);max-width:280px;line-height:1.4;">Personalized 925 sterling silver, handcrafted in Bengaluru.</div>
      </div>
      <div style="display:flex;gap:48px;font-family:var(--font-sans);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;color:var(--fg3);">
        <div class="stack-8"><span>Shop</span><span style="color:var(--fg4);">All</span><span style="color:var(--fg4);">Pendants</span><span style="color:var(--fg4);">Rings</span></div>
        <div class="stack-8"><span>Help</span><span style="color:var(--fg4);">Care</span><span style="color:var(--fg4);">Shipping</span><span style="color:var(--fg4);">Returns</span></div>
        <div class="stack-8"><span>Reach</span><span style="color:var(--fg4);">WhatsApp</span><span style="color:var(--fg4);">Instagram</span><span style="color:var(--fg4);">hello@swarom.in</span></div>
      </div>
    </div>
    <div style="margin-top:24px;display:flex;justify-content:space-between;padding-top:16px;border-top:1px solid var(--hairline);font-family:var(--font-sans);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg4);font-weight:500;">
      <span>© 2026 Swarom</span>
      <span>Bengaluru · India</span>
    </div>
  </div>
</body></html>
