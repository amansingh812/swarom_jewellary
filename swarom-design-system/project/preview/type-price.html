<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Price · Playfair numerals</span>
    <div class="row" style="gap:36px;align-items:baseline;">
      <div class="stack-4">
        <span style="font-family:var(--font-serif);font-weight:400;font-size:18px;letter-spacing:0.04em;color:var(--charcoal);">₹ 4,800</span>
        <span class="mono">Roman</span>
      </div>
      <div class="stack-4">
        <span style="font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:18px;letter-spacing:0.04em;color:var(--charcoal);">₹ 4,800</span>
        <span class="mono">Italic</span>
      </div>
      <div class="stack-4">
        <span style="font-family:var(--font-serif);font-weight:400;font-size:30px;letter-spacing:0.04em;color:var(--charcoal);">₹ 12,400</span>
        <span class="mono">Larger PDP</span>
      </div>
    </div>
    <div class="mono" style="margin-top:8px;">Playfair Display 400 · tracking 0.04em · always prefixed with ₹</div>
  </div>
</body></html>
