<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Badges, chips, tags</span>
    <div class="row" style="gap:10px;flex-wrap:wrap;">
      <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--cream-200);border-radius:999px;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--fg2);">925 Silver</span>
      <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:transparent;border:1px solid var(--hairline);border-radius:999px;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--fg2);">Made to Order</span>
      <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--charcoal);color:var(--cream);border-radius:999px;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;">New</span>
      <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #B8956A;border-radius:999px;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:#8a6a45;">Limited</span>
    </div>
    <div class="row" style="gap:8px;flex-wrap:wrap;">
      <span style="padding:6px 10px;background:var(--cream-50);border:1px solid var(--hairline);border-radius:6px;font-family:var(--font-serif);font-size:14px;color:var(--charcoal);">amelia</span>
      <span style="padding:6px 10px;background:var(--cream-50);border:1px solid var(--hairline);border-radius:6px;font-family:var(--font-serif);font-style:italic;font-size:14px;color:var(--charcoal);">m</span>
      <span style="padding:6px 10px;background:var(--cream-50);border:1px solid var(--hairline);border-radius:6px;font-family:var(--font-serif);font-size:14px;color:var(--charcoal);">09 · 06 · 24</span>
      <span class="mono" style="align-self:center;">engraving previews</span>
    </div>
  </div>
</body></html>
