<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:24px 28px 28px;">
  <div class="stack-12">
    <span class="label">Product tile — borderless on cream</span>
    <div class="row" style="gap:20px;">
      <div class="col" style="flex:1;gap:10px;">
        <img src="../assets/product-pendant.svg" style="width:100%;border-radius:8px;display:block;">
        <div class="stack-2" style="margin-top:4px;">
          <span style="font-family:var(--font-serif);font-weight:500;font-size:18px;color:var(--charcoal);">Pendant <i style="font-weight:400;color:var(--fg3);">in your hand</i></span>
          <span style="font-family:var(--font-sans);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg4);">925 silver · engraved</span>
          <span style="font-family:var(--font-serif);font-weight:500;font-size:16px;letter-spacing:0.04em;color:var(--charcoal);margin-top:4px;">₹ 4,800</span>
        </div>
      </div>
      <div class="col" style="flex:1;gap:10px;">
        <img src="../assets/product-ring.svg" style="width:100%;border-radius:8px;display:block;">
        <div class="stack-2" style="margin-top:4px;">
          <span style="font-family:var(--font-serif);font-weight:500;font-size:18px;color:var(--charcoal);">Ring <i style="font-weight:400;color:var(--fg3);">for the second one</i></span>
          <span style="font-family:var(--font-sans);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg4);">925 silver · date</span>
          <span style="font-family:var(--font-serif);font-weight:500;font-size:16px;letter-spacing:0.04em;color:var(--charcoal);margin-top:4px;">₹ 6,200</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
