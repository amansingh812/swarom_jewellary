<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:36px 32px;">
  <div class="stack-16">
    <span class="label">Shadow & elevation</span>
    <div class="row" style="gap:24px;align-items:flex-end;">
      <div class="col" style="align-items:center;gap:10px;">
        <div style="width:140px;height:90px;background:var(--cream-50);border-radius:12px;box-shadow:0 0 0 1px rgba(31,27,22,0.15);"></div>
        <div class="stack-2" style="text-align:center;align-items:center;"><span class="label" style="letter-spacing:0.15em;">Hairline</span><span class="mono">0 0 0 1px</span></div>
      </div>
      <div class="col" style="align-items:center;gap:10px;">
        <div style="width:140px;height:90px;background:var(--cream-50);border-radius:12px;box-shadow:0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.06);"></div>
        <div class="stack-2" style="text-align:center;align-items:center;"><span class="label" style="letter-spacing:0.15em;">Soft</span><span class="mono">interactive lift</span></div>
      </div>
      <div class="col" style="align-items:center;gap:10px;">
        <div style="width:140px;height:90px;background:var(--cream-50);border-radius:12px;box-shadow:0 1px 3px rgba(31,27,22,0.06), 0 12px 40px rgba(31,27,22,0.08);"></div>
        <div class="stack-2" style="text-align:center;align-items:center;"><span class="label" style="letter-spacing:0.15em;">Card</span><span class="mono">panels, tiles</span></div>
      </div>
      <div class="col" style="align-items:center;gap:10px;">
        <div style="width:140px;height:90px;background:var(--cream-50);border-radius:12px;box-shadow:0 4px 12px rgba(31,27,22,0.08), 0 24px 60px rgba(31,27,22,0.12);"></div>
        <div class="stack-2" style="text-align:center;align-items:center;"><span class="label" style="letter-spacing:0.15em;">Lift</span><span class="mono">modal, focused PDP</span></div>
      </div>
    </div>
    <div class="mono">Warm, low-contrast charcoal at low alpha. Never blue-tinted.</div>
  </div>
</body></html>
