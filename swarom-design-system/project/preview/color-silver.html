<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Silver — cool neutrals, used as material accents</span>
    <div class="row" style="gap:12px;">
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#E6E4DF;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Silver Light</span>
          <span class="mono">#E6E4DF · --silver-light</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#C9C7C2;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Silver</span>
          <span class="mono">#C9C7C2 · --silver</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#9A9893;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Silver Dark</span>
          <span class="mono">#9A9893 · --silver-dark</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
