<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Gold — the single warm accent (hairline-only)</span>
    <div class="row" style="gap:12px;">
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#B8956A;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Gold</span>
          <span class="mono">#B8956A · --gold</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:110px;background:#D9C09A;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Gold Soft</span>
          <span class="mono">#D9C09A · --gold-soft</span>
        </div>
      </div>
      <div class="col" style="flex:1.4;background:#F6F1EA;border:1px solid var(--hairline);border-radius:6px;display:flex;align-items:center;justify-content:center;height:110px;">
        <div class="row" style="gap:12px;align-items:center;">
          <span style="height:1px;width:48px;background:linear-gradient(90deg,transparent,#B8956A,transparent);"></span>
          <span style="font-family:var(--font-sans);font-weight:500;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(31,27,22,0.5);">In use</span>
          <span style="height:1px;width:48px;background:linear-gradient(90deg,transparent,#B8956A,transparent);"></span>
        </div>
      </div>
    </div>
  </div>
</body></html>
