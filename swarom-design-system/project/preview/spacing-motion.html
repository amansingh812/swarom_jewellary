<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Motion — easing & duration</span>
    <div class="row" style="gap:24px;">
      <div class="col" style="flex:1;gap:6px;padding:16px;background:var(--cream-50);border:1px solid var(--hairline);border-radius:12px;">
        <span style="font-family:var(--font-serif);font-size:18px;color:var(--charcoal);">Ease out</span>
        <span class="mono">cubic-bezier(0.22, 0.61, 0.36, 1)</span>
        <span class="mono">entrances, fade-up</span>
        <svg viewBox="0 0 200 60" style="margin-top:4px;"><path d="M0 60 C 44 60, 72 5, 200 0" fill="none" stroke="#1F1B16" stroke-width="1.2"/></svg>
      </div>
      <div class="col" style="flex:1;gap:6px;padding:16px;background:var(--cream-50);border:1px solid var(--hairline);border-radius:12px;">
        <span style="font-family:var(--font-serif);font-size:18px;color:var(--charcoal);">Ease in-out</span>
        <span class="mono">cubic-bezier(0.65, 0, 0.35, 1)</span>
        <span class="mono">state changes, ambient</span>
        <svg viewBox="0 0 200 60" style="margin-top:4px;"><path d="M0 60 C 65 60, 135 0, 200 0" fill="none" stroke="#1F1B16" stroke-width="1.2"/></svg>
      </div>
    </div>
    <div class="row" style="gap:24px;font-family:var(--font-sans);font-size:12px;color:var(--fg3);">
      <span><b style="color:var(--fg1);font-weight:500;">150ms</b> state</span>
      <span><b style="color:var(--fg1);font-weight:500;">250ms</b> default</span>
      <span><b style="color:var(--fg1);font-weight:500;">600ms</b> reveal</span>
      <span><b style="color:var(--fg1);font-weight:500;">4s</b> ambient (shimmer, float)</span>
    </div>
  </div>
</body></html>
