<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Signal — used sparingly, never bright</span>
    <div class="row" style="gap:14px;">
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:96px;background:#5A6B3F;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Moss · Success</span>
          <span class="mono">#5A6B3F · --success</span>
        </div>
      </div>
      <div class="col" style="flex:1;">
        <div class="swatch" style="height:96px;background:#8B2E2E;"></div>
        <div class="stack-2" style="margin-top:6px;">
          <span style="font-family:var(--font-serif);font-size:16px;color:var(--charcoal);">Oxidised · Error</span>
          <span class="mono">#8B2E2E · --error</span>
        </div>
      </div>
      <div class="col" style="flex:1.4;background:var(--cream-50);border:1px solid var(--hairline);border-radius:6px;height:96px;display:flex;flex-direction:column;justify-content:center;padding:0 16px;gap:6px;">
        <span style="font-family:var(--font-sans);font-size:12px;color:#5A6B3F;">✓ You're on the list. We'll be in touch when we open doors.</span>
        <span style="font-family:var(--font-sans);font-size:12px;color:#8B2E2E;">Please enter a valid email address.</span>
      </div>
    </div>
  </div>
</body></html>
