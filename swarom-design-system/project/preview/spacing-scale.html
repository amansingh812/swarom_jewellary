<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-12">
    <span class="label">Spacing — 4-base scale</span>
    <div class="row" style="gap:18px;align-items:flex-end;">
      <div class="col" style="align-items:center;gap:6px;"><div style="width:4px;height:48px;background:var(--charcoal);"></div><span class="mono">4</span><span class="mono">s-1</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:8px;height:48px;background:var(--charcoal);"></div><span class="mono">8</span><span class="mono">s-2</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:12px;height:48px;background:var(--charcoal);"></div><span class="mono">12</span><span class="mono">s-3</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:16px;height:48px;background:var(--charcoal);"></div><span class="mono">16</span><span class="mono">s-4</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:24px;height:48px;background:var(--charcoal);"></div><span class="mono">24</span><span class="mono">s-6</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:32px;height:48px;background:var(--charcoal);"></div><span class="mono">32</span><span class="mono">s-8</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:48px;height:48px;background:var(--charcoal);"></div><span class="mono">48</span><span class="mono">s-12</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:64px;height:48px;background:var(--charcoal);"></div><span class="mono">64</span><span class="mono">s-16</span></div>
      <div class="col" style="align-items:center;gap:6px;"><div style="width:96px;height:48px;background:var(--charcoal);"></div><span class="mono">96</span><span class="mono">s-24</span></div>
    </div>
    <div class="mono">Section rhythm: ≥96px desktop, ≥64px mobile. Card padding: 24–32px.</div>
  </div>
</body></html>
